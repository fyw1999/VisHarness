controller_config:
  worker_name: controller
  job_name: controller
  calculate_type: control
  cmd:
    script-addr: ./online_workers/controller.py
    port: 20001
    host: "0.0.0.0"

tool_worker_config:
  - SplitImageIntoPatches:
      SplitImageIntoPatches_h20_1:
        calculate_type: control
        cmd:
          limit-model-concurrency: 20
          cpu-worker-threads: 8
          controller-address: http://localhost:20001
          script-addr: ./online_workers/split_image_into_patches.py
          port: 20036
          host: "0.0.0.0"
        
  - MergeBoxMask:
      MergeBoxMask_h20_1:
        calculate_type: control
        cmd:
          limit-model-concurrency: 20
          cpu-worker-threads: 8
          controller-address: http://localhost:20001
          script-addr: ./online_workers/merge_box_mask_worker.py
          port: 20037
          host: "0.0.0.0"
          iou-threshold: 0.8
          fragment-overlap-ratio: 0.2
          fragment-edge-margin-ratio: 0.03

  - PhraseToPoint:
      PhraseToPoint_local_1:
        calculate_type: control
        conda_env: "Molmo"
        cuda_visible_devices: "4"
        cmd:
          limit-model-concurrency: 16
          controller-address: http://localhost:20001
          script-addr: ./online_workers/phrase_to_points_vllm_worker.py
          port: 20038
          host: "0.0.0.0"
          model-path: /vepfs-dev/metro/hantao/nwp_bench/fyw/code/fyw/models/LLM/Molmo2-4B/
          max_tokens: 4092
          max_batch_size: 10
          gpu_memory_utilization: 0.8
          max_num_batched_tokens: 60000

      PhraseToPoint_local_2:
        calculate_type: control
        conda_env: "Molmo"
        cuda_visible_devices: "5"
        cmd:
          limit-model-concurrency: 16
          controller-address: http://localhost:20001
          script-addr: ./online_workers/phrase_to_points_vllm_worker.py
          port: 20039
          host: "0.0.0.0"
          model-path: /vepfs-dev/metro/hantao/nwp_bench/fyw/code/fyw/models/LLM/Molmo2-4B/
          max_tokens: 4092
          max_batch_size: 10
          gpu_memory_utilization: 0.8
          max_num_batched_tokens: 60000


  - PhraseToBoxMask:
      PhraseToBoxMask_local_1:
        calculate_type: control
        conda_env: "SAM"
        cuda_visible_devices: "6"
        cmd:
          limit-model-concurrency: 16
          controller-address: http://localhost:20001
          script-addr: ./online_workers/phrase_to_box_mask_worker.py
          port: 20040
          host: "0.0.0.0"
          model-path: /vepfs-dev/metro/hantao/nwp_bench/fyw/code/fyw/models/foundation_models/SAM3/sam3.pt
          max_batch_size: 8
          batch_wait_ms: 50
          max_queries_per_batch: 8
          mask_chunk_size: 0
          mask_postprocess_budget_mb: 2048

