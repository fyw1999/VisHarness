# Key direct dependencies for data generation, evaluation, SFT, and RL.
# Transitive dependencies are intentionally left to Conda and pip to resolve.
# Recreate the environment from the repository root with:
#   git submodule update --init --recursive
#   bash environment/create_main_env.sh
# Linux x86_64; the PyTorch stack requires an NVIDIA driver compatible with
# CUDA 12.9 (including any required CUDA compatibility libraries).
name: VisHarness
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11.14
  - pip=26.0.1
  - setuptools=80.10.2
  - wheel=0.46.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu129
      # Core training and inference stack.
      - torch==2.11.0+cu129
      - torchvision==0.26.0+cu129
      - torchaudio==2.11.0+cu129
      - transformers==5.5.4
      - accelerate==1.13.0
      - datasets==4.8.4
      - deepspeed==0.18.8
      - flash-attn==2.8.3
      - ms-swift==4.5.3
      - peft==0.18.1
      - qwen-vl-utils==0.0.14
      - safetensors==0.6.2
      - trl==0.29.1
      # The default PyPI wheel targets a newer CUDA; use the official cu129 wheel.
      - https://github.com/vllm-project/vllm/releases/download/v0.24.0/vllm-0.24.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl
      - ninja==1.13.0
      - quack-kernels==0.3.3
      - tokenspeed-triton==3.7.10.post20260531

      # RL runtime and experiment configuration.
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - ray==2.54.0
      - swanlab==0.9.2
      - tensordict==0.10.0
      - torchdata==0.11.0
      - transferqueue==0.1.11
      - -e ./verl

      # Data processing, evaluation, and visualization.
      - matplotlib==3.10.8
      - numpy==2.2.6
      - opencv-python==4.13.0.92
      - opencv-python-headless==4.13.0.92
      - pandas==2.3.3
      - pillow==11.3.0
      - pyarrow==23.0.1
      - pycocotools==2.0.11
      - scikit-image==0.26.0
      - scipy==1.17.1

      # API clients, local tool services, and runtime utilities.
      - aiohttp==3.13.4
      - fastapi==0.135.1
      - starlette==1.0.1
      - gradio==6.30.0
      - httpx==0.28.1
      - msgpack==1.1.2
      - nvidia-ml-py==13.595.45
      - openai==2.24.0
      - psutil==7.2.2
      - python-box==7.4.1
      - pyyaml==6.0.3
      - requests==2.33.1
      - tqdm==4.67.1
      - uvicorn==0.41.0

      # Repository tests.
      - pytest==9.0.3
      - pytest-asyncio==1.4.0
