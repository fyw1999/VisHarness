# Runtime for the PhraseToPoint visual expert.
# The worker uses the Hugging Face model files directly through Transformers
# and vLLM; the Molmo2 training repository is not required.
name: Molmo
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip=26.0.1
  - setuptools=80.10.2
  - wheel=0.46.3
  - pip:
      - torch==2.10.0
      - torchvision==0.25.0
      - torchaudio==2.10.0
      - transformers==4.57.6
      - vllm==0.17.1
      - accelerate==1.13.0
      - numpy==2.2.6
      - scipy==1.17.1
      - pillow==11.3.0
      - fastapi==0.135.1
      - uvicorn==0.41.0
      - requests==2.32.5
      - msgpack==1.1.2
      - psutil==7.2.2
