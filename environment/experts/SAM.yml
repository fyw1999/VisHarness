  - conda-forge
dependencies:
  - python=3.12
  - pip=26.0.1
  - setuptools=80.10.2
  - wheel=0.47.0
  - pip:
      - torch==2.10.0
      - torchvision==0.25.0
      - sam3==0.1.0
      - transformers==5.3.0
      - timm==1.0.25
      - numpy==1.26.4
      - scipy==1.17.1
      - pillow==12.0.0
      - opencv-python-headless==4.11.0.86
      - pycocotools==2.0.11
      - einops==0.8.2
      - safetensors==0.7.0
      - fastapi==0.135.1
      - uvicorn==0.41.0
      - requests==2.32.5
      - msgpack==1.1.2
      - psutil==7.2.2
