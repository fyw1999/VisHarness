mode: inference
model_args: 
  model_name: VisHarness
  tokenizer_path: /vepfs-dev/metro/hantao/nwp_bench/fyw/code/fyw/code/VisHarness-public/checkpoints/VisHarness/VisHarness-grpo-sft105-p8-filterstd02-trajeq-valsample-v1/archived/global_step_559
  base_url: http://localhost:8000/v1
  api_key: EMPTY

batch_size: 24
max_rounds: 12
# true: dynamic archive; false: retain every historical visual image.
archive_previous_images: true

benchmark:
  # Only GPU/vLLM resource monitoring is optional. Time/token statistics
  # are always recorded, including when enabled is false.
  enabled: false
  gpu_indices: [0, 1, 2, 3]
  # Must match the vLLM server's -tp/--tensor-parallel-size value.
  tensor_parallel_size: 1
  sample_interval_seconds: 0.2
  save_resource_trace: true

generation_args:
  max_tokens: 2048
  temperature: 0.6
  top_p: 0.95
  presence_penalty: 0.0
  timeout: 300
  extra_body:
    top_k: 20
    min_p: 0.0
    repetition_penalty: 1.0
    # return_token_ids: True
    
dataset_args:
  task_names:
    REC8K
  split: val
  dataset_path: /vepfs-dev/metro/hantao/nwp_bench/fyw/code/fyw/datasets/REC-8K/
  resume_from_ckpt: 
  save_path: results/VisHarness_GRPO_559_REC8K_val
  save_trajectory: False
  num_sample: null
  
verbosity: INFO
