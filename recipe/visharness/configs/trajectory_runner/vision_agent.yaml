mode: inference
model_args: 
  model_name: VisionAgent
  tokenizer_path: /vepfs-dev/metro/hantao/nwp_bench/fyw/code/fyw/code/VisionAgent/checkpoints/sft/Qwen3-VL-8B-Thinking/v0-20260518-001941/checkpoint-103
  base_url: http://localhost:8000/v1
  api_key: EMPTY

batch_size: 24
max_rounds: 12
# true: dynamic archive; false: retain every historical visual image.
archive_previous_images: true

benchmark:
  enabled: false
  gpu_indices: [0, 1]
  # Must match the vLLM server's -tp/--tensor-parallel-size value.
  tensor_parallel_size: 2
  sample_interval_seconds: 0.2
  save_resource_trace: true

generation_args:
  max_tokens: 2048
  temperature: 0.6
  top_p: 0.95
  presence_penalty: 0.0
  timeout: 300
  extra_body:
    top_k: 20
    min_p: 0.0
    repetition_penalty: 1.0
    # return_token_ids: True
    
dataset_args:
  task_names:
    REC8K
  split: test
  dataset_path: /vepfs-dev/metro/hantao/nwp_bench/fyw/code/fyw/datasets/REC-8K/
  resume_from_ckpt: 
  save_path: results/vision_agent_sft_qwen3vl_REC8K_test
  save_trajectory: False
  num_sample: null
  
verbosity: INFO
