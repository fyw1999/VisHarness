[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visharness"
version = "0.1.0"
description = "Multimodal tool-using trajectory generation, inference, evaluation, and SFT utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "VisHarness contributors"}]
keywords = ["multimodal", "vision-language-model", "agents", "sft"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "aiohttp>=3.9",
  "httpx>=0.27",
  "msgpack>=1.0",
  "numpy>=1.26",
  "openai>=1.50",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "pycocotools>=2.0.7",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scipy>=1.11",
  "torch>=2.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
evaluation = [
  "matplotlib>=3.8",
  "scikit-image>=0.22",
]
tools = [
  "fastapi>=0.110",
  "psutil>=5.9",
  "supervision>=0.22",
  "transformers>=4.48",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/fyw1999/VisHarness"
Issues = "https://github.com/fyw1999/VisHarness/issues"

[tool.setuptools.packages.find]
include = ["visharness*", "tool_server*"]

[tool.pytest.ini_options]
testpaths = ["visharness/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
